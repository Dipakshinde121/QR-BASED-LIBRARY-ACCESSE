<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Kiosk - Admin Login</title>
    <!-- Modern Typography: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Shared stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background visual accents -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="kiosk-container">
        <!-- Login Card -->
        <main class="kiosk-card">
            <!-- Header -->
            <header class="kiosk-header">
                <div class="logo-container">
                    <i class="fa-solid fa-user-shield logo-icon"></i>
                </div>
                <h1>Admin Portal</h1>
                <p class="subtitle">Secure Administrator Authentication</p>
            </header>

            <!-- Login Form -->
            <form id="login-form" class="form-section">
                <!-- Email Input -->
                <div class="input-group">
                    <label for="admin-email" class="input-label">Admin Email</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input 
                            type="email" 
                            id="admin-email" 
                            placeholder="admin@library.com" 
                            autocomplete="username" 
                            required
                        >
                    </div>
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <label for="admin-password" class="input-label">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input 
                            type="password" 
                            id="admin-password" 
                            placeholder="••••••••" 
                            autocomplete="current-password" 
                            required
                        >
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="login-btn" class="submit-btn">
                    <span>Authenticate</span>
                    <i class="fa-solid fa-right-to-bracket button-icon"></i>
                </button>
            </form>

            <!-- Navigation Links -->
            <footer style="margin-top: 25px; text-align: center;">
                <a href="index.html" style="color: var(--text-muted); font-size: 13px; text-decoration: none; transition: var(--transition-smooth); display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-arrow-left"></i> Back to Library Kiosk
                </a>
            </footer>
        </main>
    </div>

    <!-- Script to handle authentication -->
    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
