<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Kiosk - Authentication Portal</title>
    <!-- Modern Typography: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Shared stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- PWA Manifest & iOS Support -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
    <!-- Background visual accents -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="kiosk-container">
        <!-- Main Card -->
        <main class="kiosk-card">
            <!-- Header -->
            <header class="kiosk-header">
                <div class="logo-container" id="portal-logo" style="background: linear-gradient(135deg, var(--accent-purple), #8b5cf6);">
                    <i class="fa-solid fa-user-graduate logo-icon" id="logo-icon-element"></i>
                </div>
                <h1>Library Portal</h1>
                <p class="subtitle" id="portal-subtitle">Access your Library Account</p>
            </header>

            <!-- Segmented Control Tab Switcher -->
            <div class="login-tabs">
                <button type="button" class="tab-btn active" id="tab-student" onclick="switchTab('student')">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>Student</span>
                </button>
                <button type="button" class="tab-btn" id="tab-admin" onclick="switchTab('admin')">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>Admin</span>
                </button>
            </div>

            <!-- Student Login Form -->
            <div id="form-student-container" class="form-container active">
                <form id="student-login-form" class="form-section">
                    <!-- Roll Number Input -->
                    <div class="input-group">
                        <label for="student-roll" class="input-label">Roll Number</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-id-card input-icon"></i>
                            <input 
                                type="text" 
                                id="student-roll" 
                                placeholder="ST-2026-01" 
                                autocomplete="username" 
                                required
                            >
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="input-group">
                        <label for="student-password" class="input-label">Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input 
                                type="password" 
                                id="student-password" 
                                placeholder="••••••••" 
                                autocomplete="current-password" 
                                required
                            >
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="student-login-btn" class="submit-btn" style="background: linear-gradient(135deg, var(--accent-purple), #8b5cf6);">
                        <span>Login</span>
                        <i class="fa-solid fa-right-to-bracket button-icon"></i>
                    </button>
                </form>
            </div>

            <!-- Admin Login Form -->
            <div id="form-admin-container" class="form-container">
                <form id="admin-login-form" class="form-section">
                    <!-- Email Input -->
                    <div class="input-group">
                        <label for="admin-email" class="input-label">Admin Email</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-envelope input-icon"></i>
                            <input 
                                type="email" 
                                id="admin-email" 
                                placeholder="admin@library.com" 
                                autocomplete="username" 
                                required
                            >
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="input-group">
                        <label for="admin-password" class="input-label">Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input 
                                type="password" 
                                id="admin-password" 
                                placeholder="••••••••" 
                                autocomplete="current-password" 
                                required
                            >
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="admin-login-btn" class="submit-btn" style="background: linear-gradient(135deg, var(--accent-cyan), #0891b2);">
                        <span>Authenticate</span>
                        <i class="fa-solid fa-right-to-bracket button-icon"></i>
                    </button>
                </form>
            </div>

            <!-- Navigation / Direct Link Footer -->
            <footer style="margin-top: 25px; text-align: center; border-top: 1px solid var(--card-border); padding-top: 20px;">
                <a href="kiosk.html" style="color: var(--text-muted); font-size: 13px; text-decoration: none; transition: var(--transition-smooth); display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-desktop" style="color: var(--accent-cyan);"></i> Launch Library Kiosk Mode
                </a>
            </footer>
        </main>
    </div>

    <!-- Scripts to handle tab switching -->
    <script>
        function switchTab(role) {
            const tabStudent = document.getElementById('tab-student');
            const tabAdmin = document.getElementById('tab-admin');
            const formStudent = document.getElementById('form-student-container');
            const formAdmin = document.getElementById('form-admin-container');
            const portalLogo = document.getElementById('portal-logo');
            const logoIcon = document.getElementById('logo-icon-element');
            const portalSubtitle = document.getElementById('portal-subtitle');

            if (role === 'student') {
                tabStudent.classList.add('active');
                tabAdmin.classList.remove('active');
                formStudent.classList.add('active');
                formAdmin.classList.remove('active');
                portalLogo.style.background = 'linear-gradient(135deg, var(--accent-purple), #8b5cf6)';
                logoIcon.className = 'fa-solid fa-user-graduate logo-icon';
                portalSubtitle.textContent = 'Access your Library Account';
            } else {
                tabAdmin.classList.add('active');
                tabStudent.classList.remove('active');
                formAdmin.classList.add('active');
                formStudent.classList.remove('active');
                portalLogo.style.background = 'linear-gradient(135deg, var(--accent-cyan), #0891b2)';
                logoIcon.className = 'fa-solid fa-user-shield logo-icon';
                portalSubtitle.textContent = 'Secure Administrator Authentication';
            }
        }
    </script>

    <!-- Load Auth Configurations & Handlers -->
    <script src="config.js"></script>
    <script src="student.js"></script>
    <script src="admin.js"></script>

    <!-- Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('[PWA] Service Worker registered successfully:', reg.scope))
                    .catch(err => console.error('[PWA] Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
