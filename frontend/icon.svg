<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    
    <!-- Neon Accent Gradients -->
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#purple-grad)" stroke-width="1.5" opacity="0.15" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#cyan-grad)" stroke-width="1" opacity="0.1" />

  <!-- Stylized Book & QR Code Logo Symbol -->
  <g transform="translate(128, 128)">
    <!-- Cyan Glowing Book Spine/Cover Left -->
    <path d="M 40 210 C 40 230, 80 230, 90 210 L 90 40 C 80 60, 40 60, 40 40 Z" fill="url(#cyan-grad)" filter="url(#glow-cyan)" opacity="0.9" />
    
    <!-- Purple Glowing Book Cover Right -->
    <path d="M 90 210 C 100 230, 210 230, 210 210 L 210 40 C 210 60, 100 60, 90 40 Z" fill="url(#purple-grad)" filter="url(#glow-purple)" />
    
    <!-- QR Corner Patterns inside the Book -->
    <!-- Top-Left QR Marker -->
    <rect x="115" y="65" width="30" height="30" rx="4" fill="#0b0f19" />
    <rect x="115" y="65" width="30" height="30" rx="4" fill="none" stroke="#22d3ee" stroke-width="4.5" />
    <rect x="123" y="73" width="14" height="14" rx="2" fill="#22d3ee" />
    
    <!-- Top-Right QR Marker -->
    <rect x="165" y="65" width="30" height="30" rx="4" fill="#0b0f19" />
    <rect x="165" y="65" width="30" height="30" rx="4" fill="none" stroke="#a78bfa" stroke-width="4.5" />
    <rect x="173" y="73" width="14" height="14" rx="2" fill="#a78bfa" />
    
    <!-- Bottom-Left QR Marker -->
    <rect x="115" y="115" width="30" height="30" rx="4" fill="#0b0f19" />
    <rect x="115" y="115" width="30" height="30" rx="4" fill="none" stroke="#a78bfa" stroke-width="4.5" />
    <rect x="123" y="123" width="14" height="14" rx="2" fill="#a78bfa" />

    <!-- Small Pixel Accents -->
    <rect x="165" y="115" width="10" height="10" rx="1" fill="#22d3ee" />
    <rect x="185" y="115" width="10" height="10" rx="1" fill="#a78bfa" />
    <rect x="165" y="135" width="10" height="10" rx="1" fill="#7c3aed" />
    <rect x="175" y="125" width="10" height="10" rx="1" fill="#22d3ee" />
    <rect x="185" y="135" width="10" height="10" rx="1" fill="#0891b2" />
  </g>
</svg>
